<style>
:root{--mint:#55f2ce;--dark:#07111d;--panel:#101f2d;--line:#315064}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:#f4fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,#14293a,#07111d 70%)}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff12;background:#08131ddd;z-index:2}.brand{font-weight:900;letter-spacing:2px;color:var(--mint);font-size:14px}.pill{font-size:11px;color:#b5ccda;border:1px solid #315064;border-radius:30px;padding:6px 10px}main{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}canvas{width:min(100%,900px);height:100%;object-fit:contain;image-rendering:pixelated}#scene3d{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none;touch-action:none}body.three-ok #scene3d{display:block}body.three-ok #game{visibility:hidden}.hud,#tasklist,.controls{z-index:2}.screen{z-index:3}.toast{z-index:5}.screen{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#07111dbb,#07111ddd);z-index:1}.card{width:min(420px,100%);background:#0e1d2bdc;border:1px solid #315064;border-radius:22px;padding:24px;box-shadow:0 20px 80px #0008;text-align:center;backdrop-filter:blur(8px)}h1{font-size:clamp(32px,8vw,54px);line-height:.98;margin:6px 0 12px;letter-spacing:-2px}.sub{color:#a9bfce;font-size:14px;line-height:1.5;margin:0 auto 18px;max-width:320px}.crewline{font-size:32px;letter-spacing:2px;margin:6px 0 14px}.btn{width:100%;border-radius:13px;padding:13px 16px;margin-top:9px;font-weight:800;background:var(--mint);color:#05201d;box-shadow:0 5px 0 #1a9a83}.btn.secondary{background:#182c3c;color:#eefaff;border:1px solid #315064;box-shadow:none}.colors{display:flex;justify-content:center;gap:10px;margin:14px 0}.color{width:32px;height:32px;border-radius:50%;border:3px solid #ffffff35}.color.sel{outline:2px solid white;outline-offset:2px}.hidden{display:none!important}.hud{position:absolute;inset:12px 12px auto;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}.hudbox{background:#07131fe8;border:1px solid #315064;border-radius:12px;padding:9px 11px;font-size:12px;max-width:48%;line-height:1.4}.hudbox b{color:var(--mint)}#tasklist{position:absolute;left:12px;top:68px;background:#07131fe8;border:1px solid #315064;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.7;max-width:170px}.controls{position:absolute;inset:auto 0 16px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}.dpad button,.act{background:#0c1b2bcc;border:1px solid #7ca2b75c;border-radius:14px;font-size:20px;touch-action:none;user-select:none}.dpad button:active,.act:active{background:#24506a}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.act{width:78px;height:66px;border-radius:50%;background:#23c5a6;color:#03211c;font-size:12px;font-weight:900;pointer-events:auto}.controls .actgroup{display:flex;align-items:end;gap:10px;pointer-events:auto}.reportbtn{width:68px;height:58px;border-radius:15px;background:#e8b94b;color:#302409;font-size:10px;font-weight:900;border:2px solid #725722;touch-action:manipulation}.toast{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#06111ddd;border:1px solid #55f2ce;border-radius:12px;white-space:nowrap;font-size:13px;z-index:2}.foot{font-size:10px;color:#7891a2;margin-top:14px}#meeting{position:absolute;inset:0;z-index:3;background:#050c14ed;display:grid;place-items:center;padding:20px}.report{width:min(380px,100%);background:#132434;border:1px solid #ef6173;border-radius:20px;padding:24px;text-align:center}.report h2{color:#ff7887}.report p{line-height:1.5;color:#b9cad5}#bar{height:7px;border-radius:9px;background:#243947;overflow:hidden;margin-top:7px}#fill{height:100%;width:0;background:var(--mint);transition:width .25s}
@media(min-width:700px){.controls{padding:0 max(30px,calc((100% - 860px)/2)) 24px}.dpad{transform:scale(1.08);transform-origin:bottom left}#tasklist{left:max(20px,calc((100% - 860px)/2))}}

/* Interface espacial inspirada nas referências */
header{height:42px;background:#123a3a;border-bottom:4px solid #071816}.brand{color:#b4f8e3;font-size:12px}.screen{padding:0;background-color:#030709;background-image:radial-gradient(1px 1px at 8% 14%,white 99%,transparent),radial-gradient(1.5px 1.5px at 42% 8%,#bed6dd 99%,transparent),radial-gradient(1px 1px at 71% 22%,white 99%,transparent),radial-gradient(1.3px 1.3px at 22% 74%,white 99%,transparent),radial-gradient(1px 1px at 82% 69%,white 99%,transparent),radial-gradient(1px 1px at 50% 42%,white 99%,transparent);background-size:180px 150px,230px 190px,300px 250px,180px 130px,260px 200px,200px 170px}.card{background:none;border:0;box-shadow:none;backdrop-filter:none;width:min(480px,100%);padding:15px}.card h1{font-family:'Arial Narrow',system-ui,sans-serif;font-stretch:condensed;font-size:clamp(35px,8vw,60px);line-height:1;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:3px 4px #43535a;margin:10px 0 2px}.card .sub{margin:5px auto 14px;color:#a7c5cb}.crew-art{height:145px;display:flex;justify-content:center;align-items:end;gap:0;margin:8px auto 0}.astro{position:relative;width:55px;height:75px;border:5px solid #111;border-radius:26px 25px 13px 13px;background:var(--c);box-shadow:inset -9px -9px 0 #0004;transform:rotate(var(--r));margin:0 -3px}.astro:before{content:'';position:absolute;top:9px;right:-8px;width:37px;height:24px;background:#bce9f1;border:5px solid #111;border-radius:14px;box-shadow:inset 0 -5px 0 #72afbf}.astro:after{content:'';position:absolute;left:4px;bottom:-14px;width:14px;height:14px;border:4px solid #111;background:var(--c);border-top:0;border-radius:0 0 5px 5px;box-shadow:25px 0 0 -1px #111}.astro.big{width:75px;height:105px;border-radius:34px 34px 16px 16px;z-index:1}.astro.big:before{width:48px;height:29px;top:12px}.menu-row{display:flex;gap:10px;justify-content:center}.menu-row .btn{width:auto;flex:1}.card .btn{background:#54e1c3;color:#082722;box-shadow:0 4px 0 #143e3a;border:3px solid #1a5150;border-radius:6px;letter-spacing:1px}.card .btn.secondary{background:#112929;color:#e0fffa;border:2px solid #76ab9f;box-shadow:none}.card .btn:disabled{background:#243334;color:#8c9a9b;border-color:#3c4c4d;opacity:.8}.card .colors{margin:10px 0}.card .foot{color:#9bb0b7}.color{width:27px;height:27px}.card .pill{display:inline-block}
</style></head>
<body><div id="app"><header><div class="brand">✦ TRIPULAÇÃO ESTELAR</div><div class="pill" id="topstatus">JOGO SOLO • OFFLINE</div></header><main><canvas id="game"></canvas><canvas id="scene3d" aria-label="Cenário 3D da nave"></canvas>
<section class="screen" id="start"><div class="card"><h1>Tripulação<br>Estelar</h1><p class="sub">Uma missão entre as estrelas</p><div class="crew-art" aria-hidden="true"><div class="astro" style="--c:#70d9d8;--r:-20deg"></div><div class="astro" style="--c:#a84bb0;--r:-10deg"></div><div class="astro big" style="--c:#d8403c;--r:0deg"></div><div class="astro" style="--c:#edcd4c;--r:10deg"></div><div class="astro" style="--c:#ed9539;--r:20deg"></div></div><div class="menu-row"><button class="btn" id="play">LOCAL</button><button class="btn secondary" id="online" disabled>ONLINE<br><small>EM BREVE</small></button></div><div class="menu-row" style="margin-top:4px"><button class="btn secondary" id="how">COMO JOGAR</button><button class="btn secondary" id="wardrobe">VISUAL</button></div><div style="font-size:12px;color:#c9e8e5;margin-top:16px">ESCOLHA SUA COR</div><div class="colors" id="colors"></div><div class="foot">Modo solo contra personagens do jogo • Online com amigos ainda não disponível</div></div></section>
<div class="hud hidden" id="hud"><div class="hudbox"><b id="role">TRIPULANTE</b><br><span id="status">Complete as tarefas</span><div id="bar"><div id="fill"></div></div></div><div class="hudbox" id="clock">⏱ 00:00<br>👥 5 a bordo</div></div><div id="tasklist" class="hidden"><b style="color:var(--mint)">MISSÃO</b><br><span id="tasks"></span></div>
<div class="controls hidden" id="controls"><div class="dpad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="actgroup"><button class="reportbtn" id="report">REPORTAR</button><button class="act" id="action">USAR</button></div></div>
<div id="vote" class="hidden" style="position:absolute;inset:0;z-index:4;background:#051019ed;display:grid;place-items:center;padding:18px"><div class="report"><h2>🚨 REUNIÃO</h2><p>Quem você acha que é o impostor?</p><div id="choices"></div><button class="btn secondary" id="skipvote">PULAR VOTAÇÃO</button></div></div><div id="meeting" class="hidden"><div class="report"><div style="font-size:42px">🚨</div><h2 id="endtitle">MISSÃO</h2><p id="endtext"></p><button class="btn" id="again">JOGAR DE NOVO</button></div></div><div id="toast" class="toast hidden"></div>
</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W=900,H=620,scale=1,raf,last=0,elapsed=0,running=false,done=false,role='crew',selected='#f39a38',tasks=[],completed=0,players=[],keys={},move={x:0,y:0},toastTimer=0,killCooldown=0,paused=false,three=null;const palette=['#f39a38','#5fd9ee','#cc5cff','#5ce68e','#ff6074','#f1db4b','#f37bd1','#9eaab5'];const stations=[{x:.16,y:.25,name:'NAVEGAÇÃO'},{x:.83,y:.26,name:'COMUNICAÇÕES'},{x:.17,y:.77,name:'ENERGIA'},{x:.82,y:.77,name:'LABORATÓRIO'}];
const resize=()=>{let r=c.getBoundingClientRect();let d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;scale=d;W=r.width;H=r.height;ctx.setTransform(d,0,0,d,0,0)};new ResizeObserver(resize).observe(c);resize();init3D();
const colorBox=document.getElementById('colors');palette.forEach((p,i)=>{let b=document.createElement('button');b.className='color'+(i===0?' sel':'');b.style.background=p;b.setAttribute('aria-label','Cor '+(i+1));b.onclick=()=>{selected=p;document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};colorBox.appendChild(b)});
function notice(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2200)}
function init3D(){if(!window.THREE)return;try{const T=window.THREE,canvas=document.getElementById('scene3d');const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.setClearColor(0x07111c);const scene=new T.Scene();scene.background=new T.Color(0x101b27);scene.fog=new T.Fog(0x101b27,18,34);const camera=new T.PerspectiveCamera(42,1,.1,100);camera.position.set(0,15,16);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xc5eaff,0x333d42,.65));const key=new T.DirectionalLight(0xfff1d4,.85);key.position.set(-5,12,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const fill=new T.PointLight(0x49d9ff,.7,22);fill.position.set(4,6,-5);scene.add(fill);const room=new T.Group();scene.add(room);const mat=(color,rough=.8,metal=0)=>new T.MeshStandardMaterial({color,roughness:rough,metalness:metal});const floor=mat(0xb8c0b2),tile1=mat(0xc8cfbf),tile2=mat(0xaab3a6),wall=mat(0x163c3d),trim=mat(0x56cbbb),dark=mat(0x1a2933),blue=mat(0x3886aa),blueTop=mat(0x55a9cf),glow=mat(0x7cf6e0,.25,.1);let base=new T.Mesh(new T.BoxGeometry(15,.25,10),floor);base.position.y=-.2;base.receiveShadow=true;room.add(base);for(let ix=0;ix<22;ix++)for(let iz=0;iz<15;iz++){let tile=new T.Mesh(new T.BoxGeometry(.67,.035,.67),((ix+iz)%2?tile1:tile2));tile.position.set(-7.1+ix*.67,-.045,-4.7+iz*.67);tile.receiveShadow=true;room.add(tile)}function box(x,y,z,sx,sy,sz,m){let o=new T.Mesh(new T.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;room.add(o);return o}box(0,.85,-5,15,1.7,.22,wall);box(-7.5,.85,0,.22,1.7,10,wall);box(7.5,.85,0,.22,1.7,10,wall);box(0,.12,-4.82,14.7,.09,.07,trim);box(-7.32,.12,0,.07,.09,9.7,trim);box(7.32,.12,0,.07,.09,9.7,trim);for(let i=0;i<8;i++){let lamp=new T.Mesh(new T.BoxGeometry(.9,.07,.13),mat(i%2?0x68f0d5:0x55b5d4,.3));lamp.position.set(-6.1+i*1.75,1.45,-4.84);room.add(lamp)}function table(x,z,r){let g=new T.Group();g.position.set(x,0,z);room.add(g);let foot=new T.Mesh(new T.CylinderGeometry(r*.34,r*.42,.18,20),dark);foot.position.y=.08;foot.castShadow=true;g.add(foot);let stem=new T.Mesh(new T.CylinderGeometry(.12,.17,.52,16),mat(0x56636a,.5,.35));stem.position.y=.4;stem.castShadow=true;g.add(stem);let top=new T.Mesh(new T.CylinderGeometry(r,r*.95,.18,32),blue);top.position.y=.73;top.castShadow=true;top.receiveShadow=true;g.add(top);let ring=new T.Mesh(new T.TorusGeometry(r*.83,.042,8,32),mat(0x7dc9e1,.3,.2));ring.rotation.x=Math.PI/2;ring.position.y=.84;g.add(ring);let center=new T.Mesh(new T.CylinderGeometry(r*.32,r*.32,.09,24),blueTop);center.position.y=.86;g.add(center);return g}table(0,0,1.25);table(-5.7,-3.4,.93);table(5.7,-3.4,.93);table(-5.7,3.4,.93);table(5.7,3.4,.93);let emergency=new T.Mesh(new T.BoxGeometry(.68,.15,.55),mat(0xc43e38,.45));emergency.position.set(0,1.01,0);emergency.castShadow=true;room.add(emergency);let eLight=new T.PointLight(0xff4540,.7,2.5);eLight.position.set(0,1.45,0);room.add(eLight);let consoles=[];stations.forEach((s,i)=>{let x=(s.x-.5)*13.5,z=(s.y-.5)*8.3;let g=new T.Group();g.position.set(x,0,z);room.add(g);let foot=new T.Mesh(new T.BoxGeometry(.78,.48,.48),dark);foot.position.y=.23;foot.castShadow=true;g.add(foot);let screen=new T.Mesh(new T.BoxGeometry(.7,.5,.08),mat([0x65dcec,0x7fe3fa,0x67f4c9,0xf2d778][i],.35,.15));screen.position.set(0,.72,-.12);screen.rotation.x=-.15;g.add(screen);let light=new T.PointLight(0x4ce8e2,.6,1.5);light.position.set(0,1.1,0);g.add(light);consoles.push({group:g,screen,station:s})});let crewMeshes=[];function crewMesh(color,user){let g=new T.Group();let cm=mat(color,.36,.08),outline=mat(0x15222a,.7),visor=mat(0x9ce3f5,.2,.2),back= new T.Mesh(new T.BoxGeometry(.31,.64,.3),cm);back.position.set(-.31,.72,0);back.castShadow=true;g.add(back);let torso=new T.Mesh(new T.CylinderGeometry(.38,.38,.82,16),cm);torso.position.y=.82;torso.castShadow=true;torso.receiveShadow=true;g.add(torso);let dome=new T.Mesh(new T.SphereGeometry(.36,16,12,0,Math.PI*2,0,Math.PI/2),cm);dome.position.y=1.16;dome.castShadow=true;g.add(dome);let vis=new T.Mesh(new T.SphereGeometry(.24,18,12),visor);vis.scale.set(1.22,.66,.45);vis.position.set(.12,1.02,.31);vis.castShadow=true;g.add(vis);for(let lx of [-.2,.2]){let leg=new T.Mesh(new T.CylinderGeometry(.13,.13,.34,10),cm);leg.position.set(lx,.26,0);leg.castShadow=true;g.add(leg)}let sh=new T.Mesh(new T.CircleGeometry(.48,20),new T.MeshBasicMaterial({color:0x10151a,transparent:true,opacity:.27}));sh.rotation.x=-Math.PI/2;sh.position.y=.012;g.add(sh);if(user){let ring=new T.Mesh(new T.TorusGeometry(.58,.035,8,32),glow);ring.rotation.x=Math.PI/2;ring.position.y=.05;g.add(ring)}scene.add(g);return g}let lastCount=0;three={renderer,scene,camera,crewMeshes,consoles,crewMesh};document.body.classList.add('three-ok');function onResize(){let r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.fov=r.width<520?48:42;camera.updateProjectionMatrix()}new ResizeObserver(onResize).observe(canvas);onResize();}catch(err){console.warn('3D indisponível',err)}}
function render3D(){if(!three)return;let T=window.THREE,{renderer,scene,camera,crewMeshes,crewMesh,consoles}=three;while(crewMeshes.length<players.length)crewMeshes.push(crewMesh(players[crewMeshes.length]?.col||'#ef9a38',crewMeshes.length===0));players.forEach((p,i)=>{let g=crewMeshes[i];g.visible=!p.reported;g.scale.set(1,p.alive?1:.35,1);g.position.set((p.x/W-.5)*13.5,0,(p.y/H-.5)*8.3);if(i===0){g.position.y=.035;g.rotation.y=move.x<0?-Math.PI/2:move.x>0?Math.PI/2:move.y<0?Math.PI:0;}else g.rotation.y=Math.atan2(p.dx||0,p.dy||1);});consoles.forEach(({screen,station})=>{let t=tasks.find(v=>v.name===station.name);screen.material.color.set(t?.done?0x50e3a4:0x63cce0);screen.material.emissive=new T.Color(t?.done?0x145d46:0x082632);});renderer.render(scene,camera)}
function start(){if(three){three.crewMeshes.forEach(g=>three.scene.remove(g));three.crewMeshes.length=0;}document.getElementById('start').classList.add('hidden');['hud','tasklist','controls'].forEach(x=>document.getElementById(x).classList.remove('hidden'));document.getElementById('meeting').classList.add('hidden');running=true;done=false;paused=false;document.getElementById('vote').classList.add('hidden');elapsed=0;completed=0;role=Math.random()<.35?'impostor':'crew';tasks=stations.slice().sort(()=>Math.random()-.5);tasks=tasks.map(s=>({...s,done:false}));players=[{x:W*.5,y:H*.52,col:selected,user:true,alive:true},{x:W*.32,y:H*.35,col:palette[2],name:'Luna',alive:true,dx:1,dy:0},{x:W*.68,y:H*.34,col:palette[4],name:'Cometa',alive:true,dx:-1,dy:0},{x:W*.35,y:H*.68,col:palette[3],name:'Astro',alive:true,dx:0,dy:-1},{x:W*.68,y:H*.67,col:palette[5],name:'Pip',alive:true,dx:0,dy:1}];let me=players[0];let aiIndex=1+Math.floor(Math.random()*4);players[aiIndex].isImpostor=true;killCooldown=10;document.getElementById('role').textContent=role==='crew'?'TRIPULANTE':'IMPOSTOR';document.getElementById('role').style.color=role==='crew'?'#55f2ce':'#ff6878';document.getElementById('status').textContent=role==='crew'?'Faça as tarefas da nave':'Elimine sem ser visto';document.getElementById('tasks').innerHTML=role==='crew'?tasks.map((t,i)=>`<span id="task${i}">◯ ${t.name}</span>`).join('<br>'):'Encontre a tripulação.<br>Use perto de alguém.';notice(role==='crew'?'Missão iniciada! Complete as tarefas.':'Você é o impostor. Boa sorte!');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('how').onclick=()=>notice('Use as setas ou WASD para andar. Complete os 4 painéis; se encontrar um corpo, reporte. Como impostor, use perto de alguém para eliminar.');document.getElementById('wardrobe').onclick=()=>notice('Escolha uma cor abaixo para personalizar seu tripulante!');
function end(win,title,msg){running=false;done=true;document.getElementById('endtitle').textContent=title;document.getElementById('endtext').textContent=msg;document.getElementById('meeting').classList.remove('hidden');}
function loop(now){if(!running)return;if(paused){last=now;raf=requestAnimationFrame(loop);return;}let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;update(dt);if(three)render3D();else draw();raf=requestAnimationFrame(loop)}
function update(dt){let me=players[0];let mx=move.x+(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),my=move.y+(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0),len=Math.hypot(mx,my)||1;me.x=Math.max(32,Math.min(W-32,me.x+mx/len*180*dt));me.y=Math.max(86,Math.min(H-35,me.y+my/len*180*dt));players.slice(1).forEach((p,i)=>{if(!p.alive)return;p.t=(p.t||0)+dt;if(role==='crew'&&p.isImpostor){let victims=players.filter(v=>v.alive&&v!==p),target=victims.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!target)return;let dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*42*dt;p.y+=dy/d*42*dt;if(killCooldown<=0&&d<38){target.alive=false;killCooldown=18;if(target.user)end(false,'VOCÊ FOI ELIMINADA!','O impostor te encontrou. Tente outra partida!');else notice('Algo aconteceu na nave... procure pistas!')}return;}if(p.t>2+Math.random()*2){p.t=0;p.dx=Math.random()*2-1;p.dy=Math.random()*2-1}p.x+=p.dx*35*dt;p.y+=p.dy*35*dt;if(p.x<45||p.x>W-45)p.dx*=-1;if(p.y<90||p.y>H-45)p.dy*=-1});killCooldown-=dt;document.getElementById('clock').innerHTML='⏱ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+'<br>👥 '+players.filter(p=>p.alive).length+' a bordo';document.getElementById('fill').style.width=(completed/4*100)+'%';if(role==='crew'&&completed>=4)end(true,'NAVE SALVA!','Você completou todas as tarefas e salvou a tripulação.');if(role==='crew'&&elapsed>120)end(false,'TEMPO ESGOTADO','A nave ficou sem tempo. Tente outra vez.');}
function action(){if(!running)return;let me=players[0];if(role==='crew'){let t=tasks.find(t=>!t.done&&Math.hypot(t.x*W-me.x,t.y*H-me.y)<74);if(t){t.done=true;completed++;let idx=tasks.indexOf(t);let row=document.getElementById('task'+idx);if(row)row.innerHTML='✅ '+t.name;notice('Tarefa concluída: '+t.name);return;}notice('Chegue perto de um painel para usar.')}else{let p=players.slice(1).find(p=>p.alive&&Math.hypot(p.x-me.x,p.y-me.y)<75);if(p){p.alive=false;notice('Tripulante eliminado!');if(players.slice(1).every(p=>!p.alive))end(true,'VITÓRIA!','Você eliminou toda a tripulação.')}else notice('Aproxime-se de um tripulante.')}}document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();action()});document.getElementById('report').addEventListener('pointerdown',e=>{e.preventDefault();reportBody()});function reportBody(){if(!running||paused)return;let me=players[0],body=players.slice(1).find(p=>!p.alive&&!p.reported&&Math.hypot(p.x-me.x,p.y-me.y)<100);if(!body){notice('Não há corpo por perto para reportar.');return;}body.reported=true;paused=true;let choices=document.getElementById('choices');choices.replaceChildren();players.slice(1).filter(p=>p.alive).forEach(p=>{let button=document.createElement('button');button.className='btn secondary';button.style.margin='5px 0';button.textContent='● '+p.name;button.style.color=p.col;button.onclick=()=>{document.getElementById('vote').classList.add('hidden');paused=false;p.alive=false;p.reported=true;if(role==='crew'&&p.isImpostor){end(true,'IMPOSTOR EXPULSO!','Você descobriu '+p.name+' e salvou a tripulação!')}else if(role==='crew'){notice(p.name+' era inocente! Continue as tarefas.')}else{notice(p.name+' foi expulso. Continue a missão!');if(players.slice(1).every(v=>!v.alive))end(true,'VITÓRIA!','A tripulação foi eliminada.')}};choices.appendChild(button)});document.getElementById('vote').classList.remove('hidden');}document.getElementById('skipvote').onclick=()=>{document.getElementById('vote').classList.add('hidden');paused=false;notice('Votação pulada. Continue a missão!');};
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);move.x=d==='left'?-1:d==='right'?1:0;move.y=d==='up'?-1:d==='down'?1:0});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{move.x=0;move.y=0}))});addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Enter')action()});addEventListener('keyup',e=>keys[e.key]=false);
function rounded(x,y,w,h,r,col,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawCrew(p){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.col;ctx.beginPath();ctx.moveTo(-15,19);ctx.lineTo(-15,-7);ctx.quadraticCurveTo(-15,-24,0,-24);ctx.quadraticCurveTo(15,-24,15,-7);ctx.lineTo(15,19);ctx.quadraticCurveTo(15,25,9,25);ctx.lineTo(5,25);ctx.lineTo(3,20);ctx.lineTo(-3,20);ctx.lineTo(-5,25);ctx.lineTo(-10,25);ctx.quadraticCurveTo(-15,25,-15,19);ctx.fill();ctx.strokeStyle='#07111d';ctx.lineWidth=3;ctx.stroke();rounded(1,-15,21,12,6,'#c7f5ff','#27556c');ctx.fillStyle='#fff';ctx.fillRect(5,-12,6,2);if(p.user){ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('VOCÊ',0,39)}else{ctx.fillStyle='#fff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#26343a';ctx.strokeText(p.name||'Tripulante',0,-29);ctx.fillText(p.name||'Tripulante',0,-29)}ctx.restore()}
function draw(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#a4aa98';ctx.fillRect(0,0,W,H);
const tile=28;ctx.save();ctx.translate(W/2,0);ctx.rotate(Math.PI/4);ctx.fillStyle='#bac1af';for(let y=-H*2;y<H*2;y+=tile)for(let x=-W*2;x<W*2;x+=tile)if(((x/tile+y/tile)&1)===0)ctx.fillRect(x,y,tile,tile);ctx.restore();
function table(x,y,r){ctx.beginPath();ctx.arc(x,y+6,r,0,Math.PI*2);ctx.fillStyle='#233b46';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#172c36';ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.91,0,Math.PI*2);ctx.fillStyle='#4786a9';ctx.fill();ctx.strokeStyle='#193c4b';ctx.stroke();}
let tr=Math.min(W*.19,H*.12,85);table(W*.5,H*.53,tr);table(0,H*.22,tr*.82);table(W,H*.22,tr*.82);table(0,H*.84,tr*.82);table(W,H*.84,tr*.82);
ctx.fillStyle='#253742';ctx.fillRect(W*.5-23,H*.53-15,46,30);ctx.fillStyle='#efc149';ctx.fillRect(W*.5-19,H*.53-12,38,24);ctx.fillStyle='#d24542';ctx.fillRect(W*.5-13,H*.53-8,26,16);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 8px system-ui';ctx.fillText('EMERGÊNCIA',W*.5,H*.53+28);
stations.forEach(s=>{let t=tasks.find(t=>t.name===s.name);if(!t)return;let x=s.x*W,y=s.y*H;rounded(x-20,y-17,40,34,5,t.done?'#50a780':'#56676b','#192b31');rounded(x-14,y-12,28,19,3,t.done?'#8bffcf':'#9bdaed','#203638');ctx.fillStyle='#ffec80';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(t.done?'✓':'!',x,y+2);ctx.font='bold 9px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#243238';ctx.strokeText(s.name,x,y+30);ctx.fillStyle='#fff';ctx.fillText(s.name,x,y+30)});
players.forEach(p=>{if(p.alive)drawCrew(p);else{ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(p.x,p.y+10,18,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#effaff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('×',p.x,p.y-10)}});
}
})();
